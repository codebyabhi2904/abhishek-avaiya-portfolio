    <script>
      // Set the theme before first paint so there is no flash of the wrong
      // palette. Mirrors the logic in ThemeContext.jsx.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!-- Loaded non-render-blocking: the stylesheet swaps to "all" once fetched,
         so the page can paint immediately with the fallback font instead of
         waiting on four font families to download first. -->

      as="style"
